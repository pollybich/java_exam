spring:
  application:
    name: media-portal
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/media_portal}
    username: ${DB_USER:media}
    password: ${DB_PASSWORD:media}
  jackson:
    deserialization:
      accept-float-as-int: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: 8080
