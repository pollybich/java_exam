services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: media_portal
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d media_portal"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/media_portal
      DB_USER: media
      DB_PASSWORD: media
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
